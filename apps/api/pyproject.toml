[project]
name = "analisebolsa-api"
version = "0.1.0"
description = "API e worker EOD do analisebolsa"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.165.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "pywebpush>=2.0",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.5",
]

[tool.uv]
package = false

# Vercel: a API roda como função Python (Fluid compute).
[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["db: testes que precisam de Postgres (DATABASE_URL_TEST)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
