# Aplica as migrations do Alembic no banco de produção.
# Roda em todo push na main que mexe em migrations, e sob demanda.
name: Migrations

on:
  push:
    branches: [main]
    paths: ["apps/api/migrations/**"]
  workflow_dispatch:

concurrency:
  group: banco-producao
  cancel-in-progress: false

jobs:
  migrar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vercel-env
        with:
          token: ${{ secrets.VERCEL_TOKEN }}
          database_url: ${{ secrets.DATABASE_URL }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - run: uv run alembic upgrade head
      - run: uv run alembic current
