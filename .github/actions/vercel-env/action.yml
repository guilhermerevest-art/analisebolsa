name: Variáveis da Vercel
description: >
  Baixa as variáveis de produção do projeto analisebolsa-api na Vercel para
  apps/api/.env, que a api e o worker leem. Assim a Vercel é o único lugar
  com configuração; o GitHub só guarda o VERCEL_TOKEN. Exceção: se o time da
  Vercel obriga variáveis Sensitive (que o GitHub não consegue ler), o
  DATABASE_URL pode vir do segredo de mesmo nome no GitHub.
inputs:
  token:
    description: Token da Vercel
    required: true
  database_url:
    description: DATABASE_URL vindo de um segredo do GitHub (opcional; tem prioridade)
    required: false
    default: ""
  whatsapp_token:
    description: WHATSAPP_TOKEN vindo de um segredo do GitHub (opcional; tem prioridade)
    required: false
    default: ""
  vapid_private_key:
    description: VAPID_PRIVATE_KEY vindo de um segredo do GitHub (opcional; tem prioridade)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Baixa as variáveis
      shell: bash
      working-directory: apps/api
      env:
        VERCEL_TOKEN: ${{ inputs.token }}
        DATABASE_URL_GITHUB: ${{ inputs.database_url }}
        WHATSAPP_TOKEN_GITHUB: ${{ inputs.whatsapp_token }}
        VAPID_PRIVATE_KEY_GITHUB: ${{ inputs.vapid_private_key }}
        VERCEL_ORG_ID: team_fWEuENXE3yFNvvhgguAgrDg8
        VERCEL_PROJECT_ID: prj_EzFOVDRakt67PFaYGSDQo36rsAfZ
      run: |
        test -n "$VERCEL_TOKEN" || { echo "::error::defina o segredo VERCEL_TOKEN no repositório"; exit 1; }
        npx --yes vercel@latest env pull .env --environment=production --yes >/dev/null
        if [ -n "$DATABASE_URL_GITHUB" ]; then
          grep -v '^DATABASE_URL=' .env > .env.tmp || true
          printf 'DATABASE_URL="%s"\n' "$DATABASE_URL_GITHUB" >> .env.tmp
          mv .env.tmp .env
        fi
        # Segredos que a Vercel guarda como sensitive (ilegíveis) podem vir do GitHub.
        for nome in WHATSAPP_TOKEN VAPID_PRIVATE_KEY; do
          var="${nome}_GITHUB"; valor="${!var}"
          if [ -n "$valor" ]; then
            grep -v "^${nome}=" .env > .env.tmp || true
            printf '%s="%s"\n' "$nome" "$valor" >> .env.tmp
            mv .env.tmp .env
          fi
        done
        # Variáveis do tipo "sensitive" vêm vazias: as que o worker usa precisam ser "encrypted".
        grep -qE '^DATABASE_URL="?postgres(ql)?://' .env || { echo "::error::DATABASE_URL ilegível ou ausente no projeto analisebolsa-api. Variáveis Sensitive não podem ser lidas pelo GitHub: recrie-a com Sensitive desligado ou crie o segredo DATABASE_URL no GitHub."; exit 1; }
        while IFS= read -r linha; do
          valor="${linha#*=}"; valor="${valor%\"}"; valor="${valor#\"}"
          [ -n "$valor" ] && echo "::add-mask::$valor"
        done < <(grep -E '^[A-Z_]+=' .env)
        echo "variáveis carregadas: $(grep -cE '^[A-Z_]+=' .env)"
