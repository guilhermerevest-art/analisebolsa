# Ambiente de desenvolvimento local: `docker compose up -d postgres`
# e depois, em apps/api: `uv run alembic upgrade head`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: analisebolsa_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  api:
    build: ./apps/api
    profiles: ["api"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/analisebolsa_dev
    ports:
      - "8000:8000"

  worker:
    build: ./apps/api
    profiles: ["worker"]
    command: ["python", "-m", "worker.eod"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/analisebolsa_dev

volumes:
  pgdata:
